# Publica la app en GitHub Pages (https://padilla05x.github.io/mi-u/) con cada push a main.
# Requiere en el repositorio: Settings → Pages → Source: "GitHub Actions".
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega otro push, espera en vez de cortar el que está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Probar y construir
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Lint
        run: npm run lint

      # GITHUB_ACTIONS=true hace que vite.config.ts use base '/mi-u/'.
      - name: Construir
        run: npm run build

      - name: Subir dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
